[pytest]
testpaths = tests
# asyncio_mode=auto: teste async não precisa de marcador em cada função.
asyncio_mode = auto
# Um único event loop para a sessão inteira. O cliente do Mongo (Motor) é um
# singleton do módulo e fica preso ao loop em que foi usado primeiro; com um
# loop por teste ele quebraria com "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
